name: Deploy to Tencent Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 152.136.27.117
          username: root
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            cd /opt/crossborder-ai
            echo "[1/5] Pull latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "[2/5] Update Python dependencies..."
            source venv/bin/activate
            pip install -r requirements.txt -q

            echo "[3/5] Rebuild frontend..."
            cd shared/frontend
            npm install --silent
            npm run build

            echo "[4/5] Restart backend..."
            sudo systemctl restart crossborder.service
            sleep 3
            if ! systemctl is-active --quiet crossborder.service; then
              echo "Backend service failed to start!"
              journalctl -u crossborder.service -n 40 --no-pager || true
              exit 1
            fi

            echo "[5/5] Reload Nginx + health check..."
            sudo nginx -s reload
            sleep 2
            if ! curl -fsS "http://127.0.0.1:8000/api/health" >/dev/null; then
              echo "Health check failed!"
              journalctl -u crossborder.service -n 40 --no-pager || true
              exit 1
            fi

            echo "Deploy done!"
            systemctl status crossborder.service --no-pager | head -5
            curl -fsS "http://127.0.0.1:8000/api/health" || true
