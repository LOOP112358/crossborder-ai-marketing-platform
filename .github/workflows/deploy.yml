name: Deploy to Tencent Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 152.136.27.117
          username: root
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            cd /root/code/group19/crossborder-ai
            echo "[1/5] Pull latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "[2/5] Update Python dependencies + CJK fonts..."
            source venv/bin/activate
            pip install -r requirements.txt -q
            # 海报中文叠字需要 CJK 字体（本机 Windows 有雅黑，云端 Linux 默认没有）
            if command -v apt-get >/dev/null 2>&1; then
              apt-get install -y -qq fonts-noto-cjk fonts-wqy-microhei || true
            fi

            echo "[3/5] Rebuild frontend..."
            cd shared/frontend
            npm install --silent
            npm run build

            echo "[4/5] Restart backend..."
            sudo systemctl restart crossborder.service
            sleep 3
            if ! systemctl is-active --quiet crossborder.service; then
              echo "Backend service failed to start!"
              journalctl -u crossborder.service -n 40 --no-pager || true
              exit 1
            fi

            echo "[5/5] Reload Nginx + health check..."
            sudo nginx -s reload
            HEALTH_URL="http://127.0.0.1:8000/api/health"
            ok=0
            for i in $(seq 1 20); do
              if curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then
                echo "Health OK (attempt $i/20)"
                ok=1
                break
              fi
              if ! systemctl is-active --quiet crossborder.service; then
                echo "Backend died while waiting for health"
                journalctl -u crossborder.service -n 80 --no-pager || true
                exit 1
              fi
              echo "  waiting for :8000 ... ($i/20)"
              sleep 3
            done
            if [ "$ok" -ne 1 ]; then
              echo "Health check failed after ~60s"
              journalctl -u crossborder.service -n 80 --no-pager || true
              exit 1
            fi

            echo "Deploy done!"
            systemctl status crossborder.service --no-pager | head -5
            curl -fsS "$HEALTH_URL" || true
