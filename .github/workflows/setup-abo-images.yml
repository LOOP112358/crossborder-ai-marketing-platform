name: Setup ABO dataset on server

# 在云服务器下载 ABO listings + images-small，写入 .env，导入/回填图片并重启。
# 在 GitHub Actions 页面手动 Run workflow 触发（约需 3GB+ 磁盘与较长时间）。
on:
  workflow_dispatch:

jobs:
  setup-abo:
    runs-on: ubuntu-latest
    steps:
      - name: Download ABO on server and wire into app
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 152.136.27.117
          username: root
          password: ${{ secrets.DEPLOY_PASSWORD }}
          command_timeout: 180m
          script: |
            set -euo pipefail

            APP_DIR=/opt/crossborder-ai
            DATA_DIR=/opt/abo-data
            LISTINGS_URL=https://amazon-berkeley-objects.s3.amazonaws.com/archives/abo-listings.tar
            IMAGES_URL=https://amazon-berkeley-objects.s3.amazonaws.com/archives/abo-images-small.tar

            echo "[0] Disk / memory:"
            df -h /opt || df -h /
            free -h || true

            avail_kb=$(df -Pk /opt 2>/dev/null | awk 'NR==2{print $4}')
            if [ -n "${avail_kb:-}" ] && [ "$avail_kb" -lt 7000000 ]; then
              echo "ERROR: need ~7GB free under /opt (have ${avail_kb}KB). Abort."
              exit 1
            fi

            # 小内存机器：加 2G swap，避免 import 被 OOM kill (exit 137)
            if ! swapon --show | grep -q .; then
              echo "[0b] Creating 2G swapfile..."
              if [ ! -f /swapfile ]; then
                fallocate -l 2G /swapfile 2>/dev/null || dd if=/dev/zero of=/swapfile bs=1M count=2048
                chmod 600 /swapfile
                mkswap /swapfile
              fi
              swapon /swapfile || true
            fi
            free -h || true

            mkdir -p "$DATA_DIR"
            cd "$DATA_DIR"

            echo "[1] Download abo-listings.tar (83MB) if needed..."
            if [ ! -f abo-listings.tar ]; then
              wget -c --timeout=30 --tries=10 -O abo-listings.tar "$LISTINGS_URL"
            else
              echo "  abo-listings.tar already present"
            fi

            echo "[2] Download abo-images-small.tar (~3GB) if needed..."
            if [ ! -f abo-images-small.tar ]; then
              wget -c --timeout=60 --tries=20 -O abo-images-small.tar "$IMAGES_URL"
            else
              echo "  abo-images-small.tar already present ($(du -h abo-images-small.tar | cut -f1))"
            fi

            echo "[3] Extract listings..."
            if [ ! -d listings/metadata ]; then
              tar -xf abo-listings.tar
            else
              echo "  listings/ already extracted"
            fi

            echo "[4] Extract images (slow)..."
            if [ ! -d images/small ]; then
              tar -xf abo-images-small.tar
            else
              echo "  images/small already extracted"
            fi

            echo "[5] Update $APP_DIR/.env ..."
            ENV_FILE="$APP_DIR/.env"
            touch "$ENV_FILE"
            tmp=$(mktemp)
            grep -Ev '^(ABO_LISTINGS_DIR|ABO_IMAGES_DIR|ABO_IMPORT_LIMIT)=' "$ENV_FILE" > "$tmp" || true
            {
              echo "ABO_LISTINGS_DIR=$DATA_DIR"
              echo "ABO_IMAGES_DIR=$DATA_DIR"
              echo "ABO_IMPORT_LIMIT=0"
            } >> "$tmp"
            mv "$tmp" "$ENV_FILE"
            echo "  ABO paths written:"
            grep -E '^ABO_' "$ENV_FILE" || true

            echo "[6] Stop app to free RAM, then import in low-memory steps..."
            systemctl stop crossborder.service || true
            sleep 2
            sync; echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true
            free -h || true

            cd "$APP_DIR"
            # 拉最新代码（含低内存 import 修复）
            git fetch origin main || true
            git reset --hard origin/main || true
            # shellcheck disable=SC1091
            source venv/bin/activate

            # 全量：重建图片索引 → 回填 → 导入所有有盘图的商品
            python scripts/import_abo_kb.py --rebuild-image-index
            python scripts/import_abo_kb.py --backfill-images
            python scripts/import_abo_kb.py --import-with-images --limit 0
            # 大批量时跳过 FAISS 全量重建，避免 OOM；检索仍可用品类/关键词
            echo "[7] Restart backend + nginx (wait for uvicorn bind)..."
            systemctl start crossborder.service
            sleep 2
            if ! systemctl is-active --quiet crossborder.service; then
              echo "Backend service failed to become active"
              journalctl -u crossborder.service -n 80 --no-pager || true
              exit 1
            fi
            nginx -s reload || true

            HEALTH_URL="http://127.0.0.1:8000/api/health"
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then
                echo "Health OK (attempt $i/30)"
                curl -fsS "$HEALTH_URL" || true
                echo
                ok=1
                break
              fi
              if ! systemctl is-active --quiet crossborder.service; then
                echo "Backend died while waiting for health (attempt $i/30)"
                journalctl -u crossborder.service -n 80 --no-pager || true
                exit 1
              fi
              echo "  waiting for :8000 ... ($i/30)"
              sleep 3
            done
            if [ "$ok" -ne 1 ]; then
              echo "Health check failed after ~90s"
              systemctl status crossborder.service --no-pager || true
              journalctl -u crossborder.service -n 80 --no-pager || true
              ss -lntp 2>/dev/null | grep -E ':8000\b' || true
              exit 1
            fi
            echo "ABO setup done."
            ls -ld "$DATA_DIR/listings/metadata" "$DATA_DIR/images/small" || true
            du -sh "$DATA_DIR" || true
            # 有图数量抽查
            python - <<'PY'
            from app.core.database import SessionLocal, init_db
            from app.models.chat import AboProduct
            init_db()
            db = SessionLocal()
            total = db.query(AboProduct).count()
            with_img = db.query(AboProduct).filter(AboProduct.image_path.isnot(None), AboProduct.image_path != "").count()
            print(f"DB products={total} with_image_path={with_img}")
            db.close()
            PY
